name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write
  statuses: write
  checks: write
  actions: write

env:
  SOLUTION: ComputerArchitecture.slnx
  DOTNET_NOLOGO: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.filter.outputs.build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - '*.rsp'
              - '*.sln'
              - '*.slnx'
              - .github/workflows/build.yml
              - build/pack.ps1
              - build/pkg.version
              - Directory.Packages.props
              - global.json
              - NuGet.Config
              - src/**
              - test/**

  build:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.should-build == 'true'

    needs:
      - changes

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }} -v q

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test Release
        timeout-minutes: 5
        run: dotnet test --solution ${{ env.SOLUTION }} -c Release --no-restore --no-build

      - name: Test Report
        uses: dorny/test-reporter@main
        if: (success() || failure())
        with:
          name: Test Report
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          list-suites: failed
          list-tests: failed

  build-result:
    if: always()
    runs-on: ubuntu-latest

    needs:
      - changes
      - build

    steps:
      - name: Check result
        shell: pwsh
        run: |
          $shouldBuild = "${{ needs.changes.outputs.should-build }}" -eq "true"

          $jobs = @(
            @{
              Name = "build"
              Result = "${{ needs.build.result }}"
              AllowSkipped = -not $shouldBuild
            },
            @{
              Name = "changes"
              Result = "${{ needs.changes.result }}"
              AllowSkipped = $false
            }
          )

          $invalidJobs = @()

          foreach ($job in $jobs) {
            Write-Host "$($job.Name): $($job.Result)"

            $isValid =
              $job.Result -eq "success" -or
              ($job.Result -eq "skipped" -and $job.AllowSkipped)

            if (-not $isValid) {
              $invalidJobs += $job
            }
          }

          if ($invalidJobs.Count -gt 0) {
            Write-Host "Invalid job results:"

            foreach ($job in $invalidJobs) {
              Write-Host "- $($job.Name): $($job.Result)"
            }

            exit 1
          }
...
